# Reusable workflow: build a container image with an SBOM and provenance,
# scan it, and (optionally) push it to GHCR. Outputs the pushed digest so a
# deploy can pin exactly what was built and scanned.
name: reusable-container

on:
  workflow_call:
    inputs:
      context:
        type: string
        required: true
      dockerfile:
        type: string
        required: true
      image:
        type: string
        required: true
        description: Image name without registry or tag, e.g. hello-service
      build-args:
        type: string
        default: ""
      push:
        type: boolean
        default: false
      fail-on-severity:
        type: string
        default: critical
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}
      ref:
        value: ${{ jobs.build.outputs.ref }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}" >> "$GITHUB_OUTPUT"
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: |
            VERSION=${{ github.sha }}
            ${{ inputs.build-args }}
          tags: ${{ steps.name.outputs.name }}:${{ github.sha }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.name.outputs.name }}:${{ github.sha }}
          severity-cutoff: ${{ inputs.fail-on-severity }}
          fail-build: true
          output-format: table
      - name: Reference
        id: ref
        if: inputs.push
        run: |
          ref="${{ steps.name.outputs.name }}@${{ steps.build.outputs.digest }}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Pushed \`${ref}\`" >> "$GITHUB_STEP_SUMMARY"
