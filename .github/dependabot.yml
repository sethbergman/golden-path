version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /docker/go
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /examples/hello-service
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: ["/terraform/modules/service-baseline", "/terraform/examples/hello-service"]
    schedule: { interval: weekly }
